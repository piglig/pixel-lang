name: Prepare native toolchain
description: Build and verify a platform-native compiler before installing PixelLang
runs:
  using: composite
  steps:
    - shell: bash
      run: uv sync --locked --no-install-project
    - name: Build native seed
      shell: bash
      run: |
        .venv/bin/python - <<'PYTHON'
        import json
        from pathlib import Path
        from pixellang.native_codegen import build_native, entry_session
        code = json.loads(Path("pixellang/artifacts/compiler.json").read_text())
        build_native(code, "build/native-seed/compiler", optimization=1,
                     max_depth=1024, session=entry_session(code))
        PYTHON
    - name: Verify self-hosting and PNG recovery
      shell: bash
      run: |
        .venv/bin/python scripts/verify_native_selfhost.py \
          --seed pixellang/artifacts/compiler.json \
          --native-compiler build/native-seed/compiler \
          --output "$RUNNER_TEMP/pixel-native"
        .venv/bin/python scripts/stage_native_compiler.py \
          --acceptance "$RUNNER_TEMP/pixel-native" \
          --output "$RUNNER_TEMP/pixel-bundle"
    - name: Install verified bundle
      shell: bash
      run: |
        cp "$RUNNER_TEMP/pixel-bundle/"* pixellang/artifacts/
        uv sync --locked
        uv run pixel doctor
