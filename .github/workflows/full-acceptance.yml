name: Full compiler and PNG acceptance
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: full-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: npm --prefix vscode ci
      - run: npm --prefix vscode run prepare-runtime
      - name: Three generations and complete PNG roundtrip
        run: uv run python scripts/verify_preview.py release --workers 2 --output "$RUNNER_TEMP/pixel-release"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: complete-compiler-acceptance
          path: ${{ runner.temp }}/pixel-release
          retention-days: 14
